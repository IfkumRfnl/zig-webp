name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Format, tests, and corpus regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Local composite action (shell-only) instead of mlugg/setup-zig@v2,
      # which still declares the deprecated Node 20 runtime. See
      # .github/actions/setup-zig/action.yml for the rationale.
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check .

      # Compiles the library and the four CLI tools that back
      # tools/webp-oracle.sh, so tool breakage cannot merge silently.
      - name: Compile library and tools
        run: zig build check

      # The unit test suite includes the hash-based corpus regression:
      # decoded RGBA and alpha planes of the committed corpus are compared
      # against SHA-256 hashes in testdata/corpus-hashes.tsv, so CI needs
      # no dwebp. Full dwebp/cwebp differential runs stay local via
      # tools/webp-oracle.sh.
      - name: Run tests
        run: zig build test

  # Compatibility-matrix / portability row: the full test suite — including
  # the byte-exact SHA-256 corpus regression — on a 32-bit usize target
  # (wasm32-wasi) under wasmtime, plus `zig build wasm-check` compile gates
  # for the wasi/freestanding static libraries and the wasi test binary.
  wasm:
    name: Wasm32 tests (wasi, wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Compile library and unit tests for wasm32
        run: zig build wasm-check

      - name: Run tests on wasm32-wasi under wasmtime
        run: zig build test -Dtarget=wasm32-wasi -fwasmtime

  # Compatibility-matrix row (RELEASING.MD): the full test suite — including
  # the byte-exact SHA-256 corpus regression — on a big-endian target,
  # executed under user-mode QEMU.
  big-endian:
    name: Big-endian tests (powerpc64, QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Install QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Run tests on powerpc64 under QEMU
        run: zig build test -Dtarget=powerpc64-linux -fqemu

  # Compatibility-matrix row (RELEASING.MD): macOS aarch64. No fmt check
  # here — redundant with the Linux job.
  macos:
    name: macOS tests (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Compile library and tools
        run: zig build check

      - name: Run tests
        run: zig build test
